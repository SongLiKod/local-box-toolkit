<!DOCTYPE html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>LocalBox 本地工具箱</title>
    <script>
      // mammoth 等库的浏览器兼容垫片
      window.global = window
    </script>
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('localbox:themeMode')
          var mode = raw ? JSON.parse(raw) : 'light'
          var theme = mode
          if (mode === 'system') {
            theme =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          }
          document.documentElement.classList.remove('light', 'dark')
          document.documentElement.classList.add(theme === 'dark' ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.classList.add('light')
        }
      })()
    </script>
    <script type="module" crossorigin src="./assets/index-408de444.js"></script>
    <link rel="stylesheet" href="./assets/index-bd339e0b.css">
  <link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
  <body>
    <div id="app"></div>
    
  </body>
</html>
