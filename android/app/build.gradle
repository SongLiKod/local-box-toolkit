plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 版本号唯一来源 = 仓库根 package.json（Web/Electron/安卓设置页与应用内升级检查均以它为准）：
//   versionName 直接取 version；versionCode = 主*10000 + 次*100 + 修订（与 scripts/sync-version.mjs 同公式）
def rootPkgFile = file('../../package.json')
def rootPkg = new groovy.json.JsonSlurper().parse(rootPkgFile)
def verName = rootPkg.version?.toString()
if (!verName) {
    throw new GradleException("根 package.json 缺少 version 字段：${rootPkgFile}")
}
def verNums = verName.tokenize('.').collect { (it.replaceAll(/[^0-9]/, '') ?: '0') as int }
while (verNums.size() < 3) verNums.add(0)
def verCode = verNums[0] * 10000 + verNums[1] * 100 + verNums[2]

android {
    namespace 'com.localbox.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.localbox.app"
        minSdk 28
        targetSdk 34
        versionCode verCode
        versionName verName
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// 构建前需先执行：
//   npm --prefix mobile run build:h5 && node scripts/copy-android-dist.js
// CI 检测到 ANDROID_KEYSTORE_BASE64 时会把 scripts/android-signing.gradle 复制为
// app/signing.gradle 并在本文件末尾追加 apply（见 .github/workflows/release.yml）
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
