// 由 setup-offline-sdk.sh 注入到 DCloud 离线 SDK 原生工程的应用模块。
// 签名逻辑与参考工作流 screen-pulse-android 保持一致：读取 keystore.properties。
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    def keystoreProps = new Properties()
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
    android {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }
    println "localbox-signing: release signingConfig loaded from keystore.properties"
} else {
    println "localbox-signing: keystore.properties not found, release build will be unsigned"
}
